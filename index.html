<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Kevins Inventory</title>

<style>
html{touch-action:manipulation;}
*{box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#050505,#141414,#1f1a08);
    color:white;
    margin:0;
    padding:18px;
}

.page{
    max-width:780px;
    margin:0 auto;
}

.panel{
    background:rgba(20,20,20,0.96);
    border:1px solid rgba(212,175,55,0.25);
    padding:24px;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
}

h1{
    text-align:center;
    margin:8px 0 4px;
    font-size:34px;
    color:#f4d46b;
}

.subtitle{
    text-align:center;
    color:#bbb;
    margin-bottom:22px;
}

input,button{
    width:100%;
    padding:16px;
    margin:10px 0;
    border:none;
    border-radius:16px;
    font-size:17px;
}

input{
    background:#2a2a2a;
    color:white;
    outline:1px solid rgba(255,255,255,0.08);
}

button{
    background:linear-gradient(135deg,#d4af37,#f4d46b);
    color:#111;
    font-weight:bold;
    cursor:pointer;
}

#app{display:none;}

#loginBox{
    max-width:430px;
    margin:80px auto;
    text-align:center;
}

#loginError{
    color:#ff7777;
    font-weight:bold;
}

.stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
    margin:22px 0;
}

.stat-card{
    background:#242424;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:18px;
    text-align:center;
}

.stat-value{
    font-size:32px;
    font-weight:bold;
    color:#f4d46b;
}

.stat-label{
    color:#aaa;
    font-size:13px;
    margin-top:5px;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:24px;
}

.menu a{
    text-decoration:none;
    color:white;
    background:#242424;
    border:1px solid rgba(212,175,55,0.25);
    padding:22px;
    border-radius:20px;
    font-size:18px;
    font-weight:bold;
    text-align:center;
}

.menu a:active{
    transform:scale(0.98);
    background:#333;
}

.menu span{
    display:block;
    font-size:32px;
    margin-bottom:8px;
}

.logout{
    margin-top:24px;
    background:#333;
    color:white;
}

.footer{
    text-align:center;
    color:#777;
    margin-top:20px;
    font-size:13px;
}

#loadingOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    z-index:9999;
    align-items:center;
    justify-content:center;
}

.loaderBox{
    background:#1b1b1b;
    border:1px solid rgba(212,175,55,0.35);
    padding:28px;
    border-radius:20px;
    text-align:center;
    min-width:230px;
}

.spinner{
    width:48px;
    height:48px;
    border:5px solid #333;
    border-top:5px solid #d4af37;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 14px;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@media(max-width:650px){
    body{
        padding:12px;
    }

    .stats-grid{
        grid-template-columns:1fr;
    }

    .menu{
        grid-template-columns:1fr;
    }

    h1{
        font-size:29px;
    }

    .panel{
        padding:18px;
    }

    .menu a{
        padding:20px;
        font-size:17px;
    }
}
</style>
</head>

<body>

<div class="page">

<div class="panel" id="loginBox">
    <h1>Inventory Basic</h1>
    <p class="subtitle">Simple stock management system</p>

    <input type="password" id="password" placeholder="Enter password">
    <button onclick="login()">Login</button>

    <p id="loginError"></p>
</div>

<div class="panel" id="app">
    <h1>Inventory Basic</h1>
    <p class="subtitle">Add, remove, move and search stock easily</p>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="productsValue">...</div>
            <div class="stat-label">Products</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="stockValue">...</div>
            <div class="stat-label">Stock Units</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="boxesValue">...</div>
            <div class="stat-label">Boxes Used</div>
        </div>
    </div>

    <div class="menu">
        <a href="add.html"><span>➕</span>Add Stock</a>
        <a href="remove.html"><span>➖</span>Remove Stock</a>
        <a href="move.html"><span>🔁</span>Move Stock</a>
        <a href="search.html"><span>🔍</span>Search Stock</a>
        <a href="boxes.html"><span>📦</span>Manage Boxes</a>
    </div>

    <button class="logout" onclick="logout()">Logout</button>

    <div class="footer">
        Inventory Basic
    </div>
</div>

</div>

<div id="loadingOverlay">
    <div class="loaderBox">
        <div class="spinner"></div>
        <p id="loadingText">Loading...</p>
    </div>
</div>

<script>
const PASSWORD = "Kevin74";

const API_URL =
"https://script.google.com/macros/s/AKfycbw-U6GNlgib1X8IfhA2j3FKU3NpVrvfK_ZKmIrumcu8eBOIcapg7rrPz87XmWm4AhRD/exec";

function showLoading(text){
    document.getElementById("loadingText").innerText = text || "Loading...";
    document.getElementById("loadingOverlay").style.display = "flex";
}

function hideLoading(){
    document.getElementById("loadingOverlay").style.display = "none";
}

function jsonp(payload, callbackName){
    const params = new URLSearchParams(payload);
    params.append("callback", callbackName);

    const script = document.createElement("script");
    script.src = API_URL + "?" + params.toString();
    document.body.appendChild(script);

    script.onload = function(){
        script.remove();
    };
}

function login(){
    const entered = document.getElementById("password").value;

    if(entered === PASSWORD){
        localStorage.setItem("basicInventoryLoggedIn","yes");
        showApp();
    }else{
        document.getElementById("loginError").innerText = "Wrong password";
    }
}

function logout(){
    localStorage.removeItem("basicInventoryLoggedIn");
    location.reload();
}

function showApp(){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadStats();
}

function loadStats(){
    showLoading("Loading dashboard...");

    window.statsCallback = function(data){
        hideLoading();

        if(data.success){
            document.getElementById("productsValue").innerText = data.totalProducts;
            document.getElementById("stockValue").innerText = data.totalStock;
            document.getElementById("boxesValue").innerText = data.totalBoxes;
        }else{
            document.getElementById("productsValue").innerText = "-";
            document.getElementById("stockValue").innerText = "-";
            document.getElementById("boxesValue").innerText = "-";
        }
    };

    jsonp({
        action:"STATS"
    },"statsCallback");
}

document.getElementById("password").addEventListener("keydown",function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        login();
    }
});

if(localStorage.getItem("basicInventoryLoggedIn") === "yes"){
    showApp();
}
</script>

</body>
</html>
