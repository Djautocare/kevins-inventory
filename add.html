<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Add Stock</title>

<style>
html{touch-action:manipulation;}
*{box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    background:#0d0d0d;
    color:white;
    padding:18px;
    margin:0;
}

.page{max-width:700px;margin:0 auto;}

.panel{
    background:#1b1b1b;
    border:1px solid rgba(255,255,255,0.08);
    padding:22px;
    border-radius:18px;
}

h1{text-align:center;margin:8px 0 6px;}
.subtitle{text-align:center;color:#aaa;margin-bottom:22px;}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
    margin-bottom:6px;
    color:#ddd;
}

input,select,button{
    width:100%;
    padding:14px;
    margin:6px 0 12px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

input,select{
    background:#2a2a2a;
    color:white;
    border:1px solid rgba(255,255,255,0.08);
}

button{
    background:#4CAF50;
    color:white;
    font-weight:bold;
}

.search-box{
    background:#242424;
    padding:14px;
    border-radius:14px;
    margin-bottom:18px;
}

.results{
    display:none;
    margin-top:8px;
    background:#111;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    overflow:hidden;
}

.result-item{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    cursor:pointer;
}

.result-item:last-child{border-bottom:none;}

.result-title{
    font-weight:bold;
}

.result-meta{
    color:#aaa;
    font-size:13px;
    margin-top:4px;
}

.message{
    text-align:center;
    font-weight:bold;
    margin-top:12px;
}

.back{
    display:block;
    text-align:center;
    color:white;
    background:#333;
    text-decoration:none;
    padding:14px;
    border-radius:12px;
    font-weight:bold;
    margin-top:16px;
}

#loading{
    display:none;
    text-align:center;
    color:#aaa;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="page">
<div class="panel">

<h1>Add Stock</h1>
<p class="subtitle">Add a new item or add more of an existing item</p>

<div class="search-box">
    <label>Search Existing Item</label>
    <input type="text" id="existingSearch" placeholder="Start typing item name...">
    <div id="searchResults" class="results"></div>
</div>

<label>Description</label>
<input type="text" id="description" placeholder="Example: Extension lead">

<label>Quantity</label>
<input type="number" id="qty" value="1" min="1">

<label>Box / Location</label>
<select id="location">
    <option value="">Loading boxes...</option>
</select>

<button onclick="addStock()">Add Stock</button>

<div id="loading">Working...</div>
<div id="message" class="message"></div>

<a class="back" href="index.html">← Back to Dashboard</a>

</div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbw-U6GNlgib1X8IfhA2j3FKU3NpVrvfK_ZKmIrumcu8eBOIcapg7rrPz87XmWm4AhRD/exec";

let searchTimer = null;

function showMessage(text){
    document.getElementById("message").innerText = text;
}

function showLoading(show){
    document.getElementById("loading").style.display = show ? "block" : "none";
}

function loadBoxes(){
    fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({action:"GET_BOXES"})
    })
    .then(res=>res.json())
    .then(data=>{
        const select = document.getElementById("location");
        select.innerHTML = '<option value="">Select Box</option>';

        if(!data.success || !data.boxes || data.boxes.length === 0){
            select.innerHTML = '<option value="">No boxes found</option>';
            return;
        }

        data.boxes.forEach(item=>{
            const option = document.createElement("option");
            option.value = item.box;
            option.textContent = item.box;
            select.appendChild(option);
        });
    })
    .catch(error=>{
        console.error(error);
        document.getElementById("location").innerHTML =
            '<option value="">Could not load boxes</option>';
    });
}

function liveSearch(){
    const query = document.getElementById("existingSearch").value.trim();
    const resultsBox = document.getElementById("searchResults");

    clearTimeout(searchTimer);

    if(query.length < 2){
        resultsBox.style.display = "none";
        resultsBox.innerHTML = "";
        return;
    }

    searchTimer = setTimeout(()=>{
        fetch(API_URL,{
            method:"POST",
            body:JSON.stringify({
                action:"SEARCH",
                query:query
            })
        })
        .then(res=>res.json())
        .then(data=>{
            if(!data.success || !data.results || data.results.length === 0){
                resultsBox.style.display = "block";
                resultsBox.innerHTML =
                    '<div class="result-item">No matching items found</div>';
                return;
            }

            let html = "";

            data.results.slice(0,10).forEach(item=>{
                const locationText = item.locations && item.locations.length > 0
                    ? item.locations.map(loc=>loc.location + " x" + loc.qty).join(", ")
                    : "No stock currently";

                html += `
                    <div class="result-item" onclick="selectExisting('${escapeText(item.description)}')">
                        <div class="result-title">${item.description}</div>
                        <div class="result-meta">${item.itemId} • Total Qty: ${item.totalQty} • ${locationText}</div>
                    </div>
                `;
            });

            resultsBox.innerHTML = html;
            resultsBox.style.display = "block";
        })
        .catch(error=>{
            console.error(error);
            resultsBox.style.display = "block";
            resultsBox.innerHTML =
                '<div class="result-item">Search error</div>';
        });
    },250);
}

function escapeText(text){
    return String(text || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;");
}

function selectExisting(description){
    document.getElementById("description").value = description;
    document.getElementById("existingSearch").value = description;
    document.getElementById("searchResults").style.display = "none";
}

function addStock(){
    const description = document.getElementById("description").value.trim();
    const qty = document.getElementById("qty").value;
    const location = document.getElementById("location").value;

    if(!description){
        alert("Enter a description");
        return;
    }

    if(!location){
        alert("Select a box/location");
        return;
    }

    showLoading(true);
    showMessage("");

    fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({
            action:"ADD",
            description:description,
            qty:qty,
            location:location
        })
    })
    .then(res=>res.json())
    .then(data=>{
        showLoading(false);

        if(!data.success){
            showMessage(data.error || "Could not add stock");
            return;
        }

        showMessage("Added successfully: " + data.description + " (" + data.itemId + ")");

        document.getElementById("description").value = "";
        document.getElementById("existingSearch").value = "";
        document.getElementById("qty").value = "1";
        document.getElementById("searchResults").style.display = "none";
    })
    .catch(error=>{
        showLoading(false);
        console.error(error);
        showMessage("Error adding stock");
    });
}

document.getElementById("existingSearch").addEventListener("input",liveSearch);

document.getElementById("existingSearch").addEventListener("keydown",function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        const firstResult = document.querySelector(".result-item .result-title");
        if(firstResult){
            selectExisting(firstResult.innerText);
        }
    }
});

document.getElementById("description").addEventListener("keydown",function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        document.getElementById("qty").focus();
    }
});

document.getElementById("qty").addEventListener("keydown",function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        addStock();
    }
});

loadBoxes();
</script>

</body>
</html>
