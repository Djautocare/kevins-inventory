<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move Stock</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}
.box{
    background:#1e1e1e;
    padding:20px;
    border-radius:12px;
    max-width:600px;
    margin:auto;
}
input,select,button{
    width:90%;
    padding:12px;
    margin:8px;
    border:none;
    border-radius:8px;
    font-size:16px;
}
button{
    background:#d4af37;
    color:black;
    font-weight:bold;
    cursor:pointer;
}
.result{
    margin-top:15px;
    font-weight:bold;
}
a{
    color:#d4af37;
    display:block;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="box">
<h1>Move Stock</h1>

<input id="searchBox" type="text" placeholder="Search item..." oninput="searchItems()">

<select id="itemSelect" onchange="fillItem()">
    <option value="">Select Item</option>
</select>

<input id="itemId" type="text" placeholder="Item ID" readonly>

<select id="currentBox">
    <option value="">Current Box</option>
</select>

<select id="newBox">
    <option value="">Move To Box</option>
</select>

<input id="qty" type="number" min="1" value="1" placeholder="Quantity">

<button onclick="moveStock()">Move Stock</button>

<div id="message" class="result"></div>

<a href="index.html">Back to Home</a>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-U6GNlgib1X8IfhA2j3FKU3NpVrvfK_ZKmIrumcu8eBOIcapg7rrPz87XmWm4AhRD/exec";

let products = [];
let allBoxes = [];

async function postData(payload){
    const res = await fetch(SCRIPT_URL, {
        method:"POST",
        headers:{
            "Content-Type":"text/plain"
        },
        body:JSON.stringify(payload)
    });

    return await res.json();
}

async function loadBoxes(){
    const data = await postData({
        action:"GET_BOXES"
    });

    if(!data.success){
        document.getElementById("message").textContent = data.error || "Could not load boxes";
        return;
    }

    allBoxes = data.boxes || [];

    const target = document.getElementById("newBox");
    target.innerHTML = '<option value="">Move To Box</option>';

    allBoxes.forEach(box=>{
        target.innerHTML += `<option value="${box.box}">${box.box}</option>`;
    });
}

async function searchItems(){
    const q = document.getElementById("searchBox").value.trim();

    if(q.length < 1){
        document.getElementById("itemSelect").innerHTML = '<option value="">Select Item</option>';
        document.getElementById("itemId").value = "";
        document.getElementById("currentBox").innerHTML = '<option value="">Current Box</option>';
        return;
    }

    const data = await postData({
        action:"SEARCH",
        query:q
    });

    if(!data.success){
        document.getElementById("message").textContent = data.error || "Search failed";
        return;
    }

    products = data.results || [];

    const select = document.getElementById("itemSelect");
    select.innerHTML = '<option value="">Select Item</option>';

    products.forEach(item=>{
        select.innerHTML += `
            <option value="${item.itemId}">
                ${item.description} - ${item.itemId} - Qty ${item.totalQty}
            </option>
        `;
    });
}

function fillItem(){
    const selectedItemId = document.getElementById("itemSelect").value;
    document.getElementById("itemId").value = selectedItemId;

    const selectedProduct = products.find(p => p.itemId === selectedItemId);

    const current = document.getElementById("currentBox");
    current.innerHTML = '<option value="">Current Box</option>';

    if(selectedProduct && selectedProduct.locations){
        selectedProduct.locations.forEach(loc=>{
            current.innerHTML += `
                <option value="${loc.location}">
                    ${loc.location} - Qty ${loc.qty}
                </option>
            `;
        });
    }
}

async function moveStock(){
    const itemId = document.getElementById("itemId").value.trim();
    const fromBox = document.getElementById("currentBox").value;
    const toBox = document.getElementById("newBox").value;
    const qty = Number(document.getElementById("qty").value || 1);

    if(!itemId || !fromBox || !toBox || !qty){
        alert("Complete all fields");
        return;
    }

    document.getElementById("message").textContent = "Moving stock...";

    const data = await postData({
        action:"MOVE",
        itemId:itemId,
        fromBox:fromBox,
        toBox:toBox,
        qty:qty
    });

    if(!data.success){
        document.getElementById("message").textContent = data.error || "Move failed";
        return;
    }

    document.getElementById("message").textContent =
        `Moved ${data.movedQty} of ${data.itemId} from ${data.fromBox} to ${data.toBox}`;

    document.getElementById("qty").value = 1;
    searchItems();
}

loadBoxes();
</script>

</body>
</html>
