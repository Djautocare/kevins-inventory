<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Move Stock</title>

<style>
html{touch-action:manipulation;}
*{box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#050505,#151515,#1f1a08);
    color:white;
    margin:0;
    padding:18px;
}

.page{max-width:820px;margin:auto;}

.panel{
    background:#1b1b1b;
    border:1px solid rgba(212,175,55,0.25);
    padding:22px;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    margin-bottom:18px;
}

h1,h2{
    text-align:center;
    color:#f4d46b;
    margin:8px 0 12px;
}

h1{font-size:32px;}
h2{font-size:24px;}

.subtitle{
    text-align:center;
    color:#bbb;
    margin-bottom:22px;
}

input,select,button{
    width:100%;
    padding:16px;
    margin:7px 0 12px;
    border:none;
    border-radius:14px;
    font-size:17px;
}

input,select{
    background:#2a2a2a;
    color:white;
    border:1px solid rgba(255,255,255,0.08);
}

button{
    background:linear-gradient(135deg,#d4af37,#f4d46b);
    color:#111;
    font-weight:bold;
    cursor:pointer;
}

button.secondary{
    background:#333;
    color:white;
}

button.danger{
    background:#7a1f1f;
    color:white;
}

.boxCard{
    background:#242424;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:15px;
    margin:12px 0;
}

.boxTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.boxName{
    font-size:20px;
    font-weight:bold;
    color:#f4d46b;
}

.smallBtn{
    width:auto;
    padding:11px 14px;
    margin:0;
    font-size:14px;
    border-radius:12px;
}

.contents{
    margin-top:14px;
    display:none;
}

.itemRow{
    background:#303030;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    padding:14px;
    margin:8px 0;
    cursor:pointer;
}

.itemRow.selected{
    background:#d4af37;
    color:#111;
    font-weight:bold;
}

.itemDesc{font-weight:bold;}
.itemMeta{font-size:14px;color:#bbb;margin-top:4px;}
.itemRow.selected .itemMeta{color:#222;}

.result{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
    min-height:22px;
}

.back{
    display:block;
    text-align:center;
    color:white;
    background:#333;
    text-decoration:none;
    padding:15px;
    border-radius:14px;
    font-weight:bold;
    margin-top:16px;
}

.suggestion{
    background:#26210d;
    border:1px solid rgba(212,175,55,0.35);
    padding:14px;
    border-radius:14px;
    margin:10px 0;
}

#loadingOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    z-index:9999;
    align-items:center;
    justify-content:center;
}

.loaderBox{
    background:#1b1b1b;
    border:1px solid rgba(212,175,55,0.35);
    padding:28px;
    border-radius:20px;
    text-align:center;
    min-width:230px;
}

.spinner{
    width:48px;
    height:48px;
    border:5px solid #333;
    border-top:5px solid #d4af37;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 14px;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@media(max-width:600px){
    body{padding:12px;}
    h1{font-size:28px;}
    .panel{padding:18px;}
    input,select,button{font-size:16px;padding:15px;}
    .boxTop{flex-direction:column;align-items:stretch;}
    .smallBtn{width:100%;}
}
</style>
</head>

<body>

<div class="page">

<div class="panel">
<h1>🔁 Move Stock</h1>
<p class="subtitle">Move items between boxes</p>

<h2>📦 Boxes</h2>
<div id="boxList"></div>
</div>

<div class="panel">
<h2>🔎 Move Single Item</h2>

<input id="searchBox" type="text" placeholder="Search item..." oninput="searchItems()">

<select id="itemSelect" onchange="fillItem()">
    <option value="">Select Item</option>
</select>

<input id="itemId" type="text" placeholder="Item ID" readonly>

<select id="currentBox">
    <option value="">Current Box</option>
</select>

<select id="newBox">
    <option value="">Move To Box</option>
</select>

<input id="qty" type="number" min="1" value="1" placeholder="Quantity">

<button onclick="moveStock()">Move Stock</button>

<div id="message" class="result"></div>
</div>

<div class="panel">
<h2>💡 Box Combine Suggestions</h2>
<p class="subtitle">Boxes under 30 items that may be worth combining</p>
<div id="suggestions">Loading suggestions...</div>
</div>

<a class="back" href="index.html">← Back to Dashboard</a>

</div>

<div id="loadingOverlay">
    <div class="loaderBox">
        <div class="spinner"></div>
        <p id="loadingText">Working...</p>
    </div>
</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw-U6GNlgib1X8IfhA2j3FKU3NpVrvfK_ZKmIrumcu8eBOIcapg7rrPz87XmWm4AhRD/exec";

let products = [];
let allBoxes = [];
let searchTimer = null;
let boxContentsCache = {};
let selectedItems = {};

function showLoading(text){
    document.getElementById("loadingText").innerText = text || "Working...";
    document.getElementById("loadingOverlay").style.display = "flex";
}

function hideLoading(){
    document.getElementById("loadingOverlay").style.display = "none";
}

function showMessage(text){
    document.getElementById("message").innerText = text || "";
}

function esc(text){
    return String(text || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function jsonp(payload){
    return new Promise((resolve)=>{
        const callbackName = "cb_" + Date.now() + "_" + Math.floor(Math.random() * 999999);
        payload.callback = callbackName;

        const params = new URLSearchParams(payload);
        const script = document.createElement("script");

        window[callbackName] = function(data){
            resolve(data);
            delete window[callbackName];
            script.remove();
        };

        script.src = SCRIPT_URL + "?" + params.toString();
        document.body.appendChild(script);
    });
}

async function loadBoxes(){
    showLoading("Loading boxes...");

    const data = await jsonp({action:"GET_BOXES"});
    hideLoading();

    if(!data.success){
        alert(data.error || "Could not load boxes");
        return;
    }

    allBoxes = data.boxes || [];

    fillBoxDropdowns();
    renderBoxList();
    loadSuggestions();
}

function fillBoxDropdowns(){
    const target = document.getElementById("newBox");
    target.innerHTML = '<option value="">Move To Box</option>';

    allBoxes.forEach(box=>{
        target.innerHTML += `<option value="${esc(box.box)}">${esc(box.box)}</option>`;
    });
}

function renderBoxList(){
    const list = document.getElementById("boxList");
    list.innerHTML = "";

    if(allBoxes.length === 0){
        list.innerHTML = "<p>No boxes found.</p>";
        return;
    }

    allBoxes.forEach(box=>{
        const boxName = box.box;

        list.innerHTML += `
            <div class="boxCard" id="card_${esc(boxName)}">
                <div class="boxTop">
                    <div class="boxName">${esc(boxName)}</div>
                    <button class="smallBtn" onclick="toggleBoxContents('${esc(boxName)}')">
                        Show Contents
                    </button>
                </div>

                <div class="contents" id="contents_${esc(boxName)}">
                    Loading...
                </div>
            </div>
        `;
    });
}

async function toggleBoxContents(boxName){
    const contentsDiv = document.getElementById("contents_" + boxName);

    if(contentsDiv.style.display === "block"){
        contentsDiv.style.display = "none";
        return;
    }

    contentsDiv.style.display = "block";

    if(boxContentsCache[boxName]){
        renderBoxContents(boxName);
        return;
    }

    contentsDiv.innerHTML = "Loading contents...";

    const data = await jsonp({
        action:"BOX_CONTENTS",
        box:boxName
    });

    if(!data.success){
        contentsDiv.innerHTML = data.error || "Could not load contents";
        return;
    }

    boxContentsCache[boxName] = data.results || [];
    selectedItems[boxName] = [];

    renderBoxContents(boxName);
}

function renderBoxContents(boxName){
    const contentsDiv = document.getElementById("contents_" + boxName);
    const items = boxContentsCache[boxName] || [];

    if(items.length === 0){
        contentsDiv.innerHTML = "<p>This box is empty.</p>";
        return;
    }

    let html = `
        <p><b>${items.length}</b> different items in this box.</p>
    `;

    items.forEach(item=>{
        const selected = (selectedItems[boxName] || []).some(x => x.itemId === item.itemId);
        html += `
            <div class="itemRow ${selected ? "selected" : ""}"
                 onclick="toggleSelectItem('${esc(boxName)}','${esc(item.itemId)}')">
                <div class="itemDesc">${esc(item.description)}</div>
                <div class="itemMeta">${esc(item.itemId)} | Qty ${esc(item.qty)}</div>
            </div>
        `;
    });

    html += `
        <select id="selectedTarget_${esc(boxName)}">
            <option value="">Move selected items to...</option>
            ${boxOptions(boxName)}
        </select>

        <button onclick="moveSelectedItems('${esc(boxName)}')">
            Move Highlighted Items
        </button>

        <hr style="border-color:rgba(255,255,255,0.1);margin:20px 0;">

        <select id="wholeTarget_${esc(boxName)}">
            <option value="">Move whole box to...</option>
            ${boxOptions(boxName)}
        </select>

        <button class="danger" onclick="moveWholeBox('${esc(boxName)}')">
            Move Everything In This Box
        </button>
    `;

    contentsDiv.innerHTML = html;
}

function boxOptions(excludeBox){
    return allBoxes
        .filter(box => box.box !== excludeBox)
        .map(box => `<option value="${esc(box.box)}">${esc(box.box)}</option>`)
        .join("");
}

function toggleSelectItem(boxName,itemId){
    const items = boxContentsCache[boxName] || [];
    const item = items.find(x => x.itemId === itemId);

    if(!item) return;

    if(!selectedItems[boxName]) selectedItems[boxName] = [];

    const exists = selectedItems[boxName].some(x => x.itemId === itemId);

    if(exists){
        selectedItems[boxName] = selectedItems[boxName].filter(x => x.itemId !== itemId);
    }else{
        selectedItems[boxName].push(item);
    }

    renderBoxContents(boxName);
}

async function moveSelectedItems(fromBox){
    const toBox = document.getElementById("selectedTarget_" + fromBox).value;
    const items = selectedItems[fromBox] || [];

    if(!toBox){
        alert("Choose where to move the selected items");
        return;
    }

    if(items.length === 0){
        alert("Highlight at least one item first");
        return;
    }

    if(!confirm(`Move ${items.length} selected item(s) from ${fromBox} to ${toBox}?`)){
        return;
    }

    await moveMultipleItems(items, fromBox, toBox);
}

async function moveWholeBox(fromBox){
    const toBox = document.getElementById("wholeTarget_" + fromBox).value;
    const items = boxContentsCache[fromBox] || [];

    if(!toBox){
        alert("Choose where to move the whole box");
        return;
    }

    if(items.length === 0){
        alert("This box is empty");
        return;
    }

    if(!confirm(`Move EVERYTHING from ${fromBox} to ${toBox}?`)){
        return;
    }

    await moveMultipleItems(items, fromBox, toBox);
}

async function moveMultipleItems(items, fromBox, toBox){
    showLoading("Moving stock...");

    for(const item of items){
        const data = await jsonp({
            action:"MOVE",
            itemId:item.itemId,
            fromBox:fromBox,
            toBox:toBox,
            qty:item.qty
        });

        if(!data.success){
            hideLoading();
            alert(data.error || `Move failed for ${item.itemId}`);
            return;
        }
    }

    boxContentsCache = {};
    selectedItems = {};

    hideLoading();
    alert("Move complete");

    renderBoxList();
    loadSuggestions();
}

function searchItems(){
    const q = document.getElementById("searchBox").value.trim();

    clearTimeout(searchTimer);

    if(q.length < 1){
        document.getElementById("itemSelect").innerHTML = '<option value="">Select Item</option>';
        document.getElementById("itemId").value = "";
        document.getElementById("currentBox").innerHTML = '<option value="">Current Box</option>';
        return;
    }

    searchTimer = setTimeout(async function(){
        document.getElementById("itemSelect").innerHTML = '<option value="">Searching...</option>';

        const data = await jsonp({
            action:"SEARCH",
            query:q
        });

        if(!data.success){
            showMessage(data.error || "Search failed");
            return;
        }

        products = data.results || [];

        const select = document.getElementById("itemSelect");
        select.innerHTML = '<option value="">Select Item</option>';

        if(products.length === 0){
            select.innerHTML = '<option value="">No matching items</option>';
            return;
        }

        products.forEach(item=>{
            select.innerHTML += `
                <option value="${esc(item.itemId)}">
                    ${esc(item.description)} - ${esc(item.itemId)} - Qty ${esc(item.totalQty)}
                </option>
            `;
        });
    },250);
}

function fillItem(){
    const selectedItemId = document.getElementById("itemSelect").value;
    document.getElementById("itemId").value = selectedItemId;

    const selectedProduct = products.find(p => p.itemId === selectedItemId);

    const current = document.getElementById("currentBox");
    current.innerHTML = '<option value="">Current Box</option>';

    if(selectedProduct && selectedProduct.locations){
        selectedProduct.locations.forEach(loc=>{
            current.innerHTML += `
                <option value="${esc(loc.location)}">
                    ${esc(loc.location)} - Qty ${esc(loc.qty)}
                </option>
            `;
        });
    }
}

async function moveStock(){
    const itemId = document.getElementById("itemId").value.trim();
    const fromBox = document.getElementById("currentBox").value;
    const toBox = document.getElementById("newBox").value;
    const qty = Number(document.getElementById("qty").value || 1);

    if(!itemId || !fromBox || !toBox || !qty){
        alert("Complete all fields");
        return;
    }

    showLoading("Moving stock...");
    showMessage("");

    const data = await jsonp({
        action:"MOVE",
        itemId:itemId,
        fromBox:fromBox,
        toBox:toBox,
        qty:qty
    });

    hideLoading();

    if(!data.success){
        showMessage(data.error || "Move failed");
        return;
    }

    showMessage(`Moved ${data.movedQty} of ${data.itemId} from ${data.fromBox} to ${data.toBox}`);

    document.getElementById("qty").value = 1;
    boxContentsCache = {};
    selectedItems = {};
    searchItems();
    renderBoxList();
    loadSuggestions();
}

async function loadSuggestions(){
    const div = document.getElementById("suggestions");
    div.innerHTML = "Checking boxes...";

    let summaries = [];

    for(const box of allBoxes){
        const data = await jsonp({
            action:"BOX_CONTENTS",
            box:box.box
        });

        if(data.success){
            summaries.push({
                box:box.box,
                totalQty:Number(data.totalQty || 0)
            });
        }
    }

    const lowBoxes = summaries
        .filter(x => x.totalQty > 0 && x.totalQty < 30)
        .sort((a,b)=>a.totalQty - b.totalQty);

    if(lowBoxes.length < 2){
        div.innerHTML = "<p>No box combine suggestions right now.</p>";
        return;
    }

    let html = "";

    for(let i = 0; i < lowBoxes.length - 1; i += 2){
        const a = lowBoxes[i];
        const b = lowBoxes[i + 1];

        if(!b) break;

        html += `
            <div class="suggestion">
                <b>${esc(a.box)}</b> has ${esc(a.totalQty)} items<br>
                <b>${esc(b.box)}</b> has ${esc(b.totalQty)} items<br><br>
                Suggested: combine these two boxes.
            </div>
        `;
    }

    div.innerHTML = html;
}

loadBoxes();
</script>

</body>
</html>
