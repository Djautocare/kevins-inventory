<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Move Stock</title>

<style>
html{touch-action:manipulation;}
*{box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#050505,#151515,#1f1a08);
    color:white;
    margin:0;
    padding:18px;
}

.page{
    max-width:720px;
    margin:auto;
}

.panel{
    background:#1b1b1b;
    border:1px solid rgba(212,175,55,0.25);
    padding:22px;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
}

h1{
    text-align:center;
    color:#f4d46b;
    font-size:32px;
    margin:8px 0 6px;
}

.subtitle{
    text-align:center;
    color:#bbb;
    margin-bottom:22px;
}

input,select,button{
    width:100%;
    padding:16px;
    margin:7px 0 12px;
    border:none;
    border-radius:14px;
    font-size:17px;
}

input,select{
    background:#2a2a2a;
    color:white;
    border:1px solid rgba(255,255,255,0.08);
}

button{
    background:linear-gradient(135deg,#d4af37,#f4d46b);
    color:#111;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
    min-height:22px;
}

.back{
    display:block;
    text-align:center;
    color:white;
    background:#333;
    text-decoration:none;
    padding:15px;
    border-radius:14px;
    font-weight:bold;
    margin-top:16px;
}

#loadingOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    z-index:9999;
    align-items:center;
    justify-content:center;
}

.loaderBox{
    background:#1b1b1b;
    border:1px solid rgba(212,175,55,0.35);
    padding:28px;
    border-radius:20px;
    text-align:center;
    min-width:230px;
}

.spinner{
    width:48px;
    height:48px;
    border:5px solid #333;
    border-top:5px solid #d4af37;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 14px;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@media(max-width:600px){
    body{padding:12px;}
    h1{font-size:28px;}
    .panel{padding:18px;}
    input,select,button{font-size:16px;padding:15px;}
}
</style>
</head>

<body>

<div class="page">
<div class="panel">

<h1>🔁 Move Stock</h1>
<p class="subtitle">Move items from one box to another</p>

<input id="searchBox" type="text" placeholder="Search item..." oninput="searchItems()">

<select id="itemSelect" onchange="fillItem()">
    <option value="">Select Item</option>
</select>

<input id="itemId" type="text" placeholder="Item ID" readonly>

<select id="currentBox">
    <option value="">Current Box</option>
</select>

<select id="newBox">
    <option value="">Move To Box</option>
</select>

<input id="qty" type="number" min="1" value="1" placeholder="Quantity">

<button onclick="moveStock()">Move Stock</button>

<div id="message" class="result"></div>

<a class="back" href="index.html">← Back to Dashboard</a>

</div>
</div>

<div id="loadingOverlay">
    <div class="loaderBox">
        <div class="spinner"></div>
        <p id="loadingText">Working...</p>
    </div>
</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw-U6GNlgib1X8IfhA2j3FKU3NpVrvfK_ZKmIrumcu8eBOIcapg7rrPz87XmWm4AhRD/exec";

let products = [];
let allBoxes = [];
let searchTimer = null;

function showLoading(text){
    document.getElementById("loadingText").innerText = text || "Working...";
    document.getElementById("loadingOverlay").style.display = "flex";
}

function hideLoading(){
    document.getElementById("loadingOverlay").style.display = "none";
}

function showMessage(text){
    document.getElementById("message").innerText = text || "";
}

function jsonp(payload, callbackName){
    const params = new URLSearchParams(payload);
    params.append("callback", callbackName);

    const script = document.createElement("script");
    script.src = SCRIPT_URL + "?" + params.toString();
    document.body.appendChild(script);

    script.onload = function(){
        script.remove();
    };
}

function loadBoxes(){
    showLoading("Loading boxes...");

    window.moveBoxesCallback = function(data){
        hideLoading();

        if(!data.success){
            showMessage(data.error || "Could not load boxes");
            return;
        }

        allBoxes = data.boxes || [];

        const target = document.getElementById("newBox");
        target.innerHTML = '<option value="">Move To Box</option>';

        allBoxes.forEach(box=>{
            target.innerHTML += `<option value="${box.box}">${box.box}</option>`;
        });
    };

    jsonp({
        action:"GET_BOXES"
    }, "moveBoxesCallback");
}

function searchItems(){
    const q = document.getElementById("searchBox").value.trim();

    clearTimeout(searchTimer);

    if(q.length < 1){
        document.getElementById("itemSelect").innerHTML = '<option value="">Select Item</option>';
        document.getElementById("itemId").value = "";
        document.getElementById("currentBox").innerHTML = '<option value="">Current Box</option>';
        return;
    }

    searchTimer = setTimeout(function(){
        document.getElementById("itemSelect").innerHTML = '<option value="">Searching...</option>';

        window.moveSearchCallback = function(data){
            if(!data.success){
                showMessage(data.error || "Search failed");
                return;
            }

            products = data.results || [];

            const select = document.getElementById("itemSelect");
            select.innerHTML = '<option value="">Select Item</option>';

            if(products.length === 0){
                select.innerHTML = '<option value="">No matching items</option>';
                return;
            }

            products.forEach(item=>{
                select.innerHTML += `
                    <option value="${item.itemId}">
                        ${item.description} - ${item.itemId} - Qty ${item.totalQty}
                    </option>
                `;
            });
        };

        jsonp({
            action:"SEARCH",
            query:q
        }, "moveSearchCallback");

    },250);
}

function fillItem(){
    const selectedItemId = document.getElementById("itemSelect").value;
    document.getElementById("itemId").value = selectedItemId;

    const selectedProduct = products.find(p => p.itemId === selectedItemId);

    const current = document.getElementById("currentBox");
    current.innerHTML = '<option value="">Current Box</option>';

    if(selectedProduct && selectedProduct.locations){
        selectedProduct.locations.forEach(loc=>{
            current.innerHTML += `
                <option value="${loc.location}">
                    ${loc.location} - Qty ${loc.qty}
                </option>
            `;
        });
    }
}

function moveStock(){
    const itemId = document.getElementById("itemId").value.trim();
    const fromBox = document.getElementById("currentBox").value;
    const toBox = document.getElementById("newBox").value;
    const qty = Number(document.getElementById("qty").value || 1);

    if(!itemId || !fromBox || !toBox || !qty){
        alert("Complete all fields");
        return;
    }

    showLoading("Moving stock...");
    showMessage("");

    window.moveStockCallback = function(data){
        hideLoading();

        if(!data.success){
            showMessage(data.error || "Move failed");
            return;
        }

        showMessage(
            `Moved ${data.movedQty} of ${data.itemId} from ${data.fromBox} to ${data.toBox}`
        );

        document.getElementById("qty").value = 1;
        searchItems();
    };

    jsonp({
        action:"MOVE",
        itemId:itemId,
        fromBox:fromBox,
        toBox:toBox,
        qty:qty
    }, "moveStockCallback");
}

loadBoxes();
</script>

</body>
</html>
