<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remove Stock</title>

<style>
*{box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#050505,#151515,#1f1a08);
    color:white;
    margin:0;
    padding:18px;
}

.page{
    max-width:650px;
    margin:auto;
}

.panel{
    background:#1b1b1b;
    border:1px solid rgba(212,175,55,0.25);
    padding:22px;
    border-radius:20px;
}

h1{
    text-align:center;
    color:#f4d46b;
}

input,select,button{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:none;
    border-radius:12px;
    font-size:16px;
}

input,select{
    background:#2a2a2a;
    color:white;
}

button{
    background:linear-gradient(135deg,#d4af37,#f4d46b);
    color:#111;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.small{
    color:#bbb;
    text-align:center;
    font-size:14px;
}

a{
    color:#f4d46b;
    display:block;
    text-align:center;
    margin-top:18px;
}
</style>
</head>

<body>

<div class="page">
<div class="panel">

<h1>➖ Remove Stock</h1>

<input
    id="searchBox"
    type="text"
    placeholder="Search item..."
    oninput="searchItems()">

<select id="itemSelect" onchange="itemSelected()">
    <option value="">Select item</option>
</select>

<input
    id="itemId"
    type="text"
    placeholder="Item ID"
    readonly>

<select id="locationSelect">
    <option value="">Select box/location</option>
</select>

<input
    id="qty"
    type="number"
    min="1"
    value="1">

<button onclick="removeStock()">
Remove Stock
</button>

<div id="message" class="result"></div>

<p class="small">
Search updates automatically as you type.
</p>

<a href="index.html">Back to Home</a>

</div>
</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw-U6GNlgib1X8IfhA2j3FKU3NpVrvfK_ZKmIrumcu8eBOIcapg7rrPz87XmWm4AhRD/exec";

let products = [];
  async function searchItems(){

    const query =
    document.getElementById("searchBox").value.trim();

    if(query.length < 1){
        document.getElementById("itemSelect").innerHTML =
        '<option value="">Select item</option>';
        return;
    }

    const response = await fetch(
        SCRIPT_URL,
        {
            method:"POST",
            headers:{
                "Content-Type":"text/plain"
            },
            body:JSON.stringify({
                action:"SEARCH",
                query:query
            })
        }
    );

    const data = await response.json();

    products = data.results || [];

    const select =
    document.getElementById("itemSelect");

    select.innerHTML =
    '<option value="">Select item</option>';

    products.forEach(item => {

        select.innerHTML += `
        <option value="${item.itemId}">
            ${item.description}
            (${item.totalQty})
        </option>`;
    });
}

function itemSelected(){

    const itemId =
    document.getElementById("itemSelect").value;

    document.getElementById("itemId").value =
    itemId;

    const item =
    products.find(x => x.itemId === itemId);

    const locationSelect =
    document.getElementById("locationSelect");

    locationSelect.innerHTML =
    '<option value="">Select box/location</option>';

    if(!item) return;

    item.locations.forEach(loc => {

        locationSelect.innerHTML += `
        <option value="${loc.location}">
            ${loc.location} (Qty ${loc.qty})
        </option>`;
    });
}

async function removeStock(){

    const itemId =
    document.getElementById("itemId").value;

    const location =
    document.getElementById("locationSelect").value;

    const qty =
    Number(document.getElementById("qty").value);

    if(!itemId || !location){
        alert("Select an item and box");
        return;
    }

    document.getElementById("message").innerText =
    "Removing...";

    const response = await fetch(
        SCRIPT_URL,
        {
            method:"POST",
            headers:{
                "Content-Type":"text/plain"
            },
            body:JSON.stringify({
                action:"REMOVE",
                itemId:itemId,
                location:location,
                qty:qty
            })
        }
    );

    const data = await response.json();

    if(data.success){

        document.getElementById("message").innerText =
        `Removed ${data.removedQty}`;

        document.getElementById("qty").value = 1;

        searchItems();

    }else{

        document.getElementById("message").innerText =
        data.error || "Failed";

    }
}

</script>

</body>
</html>
