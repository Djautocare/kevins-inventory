<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Search Stock</title>

<style>
html{touch-action:manipulation;}
*{box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#050505,#151515,#1f1a08);
    color:white;
    padding:18px;
    margin:0;
}

.page{
    max-width:820px;
    margin:0 auto;
}

.panel{
    background:#1b1b1b;
    border:1px solid rgba(212,175,55,0.25);
    padding:22px;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
}

h1{
    text-align:center;
    margin:8px 0 6px;
    color:#f4d46b;
    font-size:32px;
}

.subtitle{
    text-align:center;
    color:#bbb;
    margin-bottom:22px;
}

input{
    width:100%;
    padding:16px;
    margin:10px 0 16px;
    border:none;
    border-radius:14px;
    font-size:17px;
    background:#2a2a2a;
    color:white;
    border:1px solid rgba(255,255,255,0.08);
}

.result-card{
    background:#242424;
    border:1px solid rgba(255,255,255,0.08);
    padding:16px;
    border-radius:16px;
    margin-bottom:12px;
}

.item-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:5px;
    color:white;
}

.item-id{
    color:#aaa;
    font-size:13px;
    margin-bottom:8px;
}

.qty{
    font-weight:bold;
    color:#f4d46b;
    margin-bottom:8px;
}

.location{
    background:#111;
    padding:10px;
    border-radius:12px;
    margin-top:7px;
    color:#ddd;
}

.empty{
    text-align:center;
    color:#aaa;
    background:#242424;
    padding:18px;
    border-radius:16px;
}

.back{
    display:block;
    text-align:center;
    color:white;
    background:#333;
    text-decoration:none;
    padding:15px;
    border-radius:14px;
    font-weight:bold;
    margin-top:16px;
}

#loadingOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    z-index:9999;
    align-items:center;
    justify-content:center;
}

.loaderBox{
    background:#1b1b1b;
    border:1px solid rgba(212,175,55,0.35);
    padding:28px;
    border-radius:20px;
    text-align:center;
    min-width:230px;
}

.spinner{
    width:48px;
    height:48px;
    border:5px solid #333;
    border-top:5px solid #d4af37;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 14px;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@media(max-width:600px){
    body{padding:12px;}
    h1{font-size:28px;}
    .panel{padding:18px;}
    input{font-size:16px;padding:15px;}
}
</style>
</head>

<body>

<div class="page">
<div class="panel">

<h1>🔍 Search Stock</h1>
<p class="subtitle">Start typing to search items</p>

<input type="text" id="searchInput" placeholder="Search by item name or ID...">

<div id="results">
    <div class="empty">Type at least 2 letters to search.</div>
</div>

<a class="back" href="index.html">← Back to Dashboard</a>

</div>
</div>

<div id="loadingOverlay">
    <div class="loaderBox">
        <div class="spinner"></div>
        <p id="loadingText">Searching...</p>
    </div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbw-U6GNlgib1X8IfhA2j3FKU3NpVrvfK_ZKmIrumcu8eBOIcapg7rrPz87XmWm4AhRD/exec";

let searchTimer = null;

function showLoading(text){
    document.getElementById("loadingText").innerText = text || "Searching...";
    document.getElementById("loadingOverlay").style.display = "flex";
}

function hideLoading(){
    document.getElementById("loadingOverlay").style.display = "none";
}

function jsonp(payload, callbackName){
    const params = new URLSearchParams(payload);
    params.append("callback", callbackName);

    const script = document.createElement("script");
    script.src = API_URL + "?" + params.toString();
    document.body.appendChild(script);

    script.onload = function(){
        script.remove();
    };
}

function liveSearch(){
    const query = document.getElementById("searchInput").value.trim();
    const results = document.getElementById("results");

    clearTimeout(searchTimer);

    if(query.length < 2){
        results.innerHTML =
            '<div class="empty">Type at least 2 letters to search.</div>';
        return;
    }

    searchTimer = setTimeout(function(){
        showLoading("Searching...");

       window.searchStockCallback = function(data){
    hideLoading();

    if(!data.success || !data.results || data.results.length === 0){
        results.innerHTML =
            '<div class="empty">No matching items found.</div>';
        return;
    }

    let filteredResults = data.results
        .filter(item => Number(item.totalQty || 0) > 0)
        .sort((a, b) => {
            const aNum = Number(String(a.itemId || "").replace(/\D/g, ""));
            const bNum = Number(String(b.itemId || "").replace(/\D/g, ""));
            return bNum - aNum;
        });

    if(filteredResults.length === 0){
        results.innerHTML =
            '<div class="empty">No items currently in stock.</div>';
        return;
    }

    let html = "";

    filteredResults.forEach(item=>{
        let locationsHtml = "";

        if(item.locations && item.locations.length > 0){
            item.locations
                .filter(loc => Number(loc.qty || 0) > 0)
                .forEach(loc=>{
                    locationsHtml += `
                        <div class="location">
                            ${loc.location} — Qty ${loc.qty}
                        </div>
                    `;
                });
        }

        html += `
            <div class="result-card">
                <div class="item-title">${item.description}</div>
                <div class="item-id">${item.itemId}</div>
                <div class="qty">Total Qty: ${item.totalQty}</div>
                ${locationsHtml}
            </div>
        `;
    });

    results.innerHTML = html;
};

        jsonp({
            action:"SEARCH",
            query:query
        }, "searchStockCallback");

    },250);
}

document.getElementById("searchInput").addEventListener("input",liveSearch);
</script>

</body>
</html>
