<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxes</title>
<style>
body{font-family:Arial;background:#111;color:white;text-align:center;padding:20px;}
.box{background:#1e1e1e;padding:20px;border-radius:12px;max-width:600px;margin:auto;}
input,button{width:90%;padding:12px;margin:8px;border:none;border-radius:8px;font-size:16px;}
button{background:#d4af37;color:black;font-weight:bold;}
a{color:#d4af37;display:block;margin-top:20px;}
</style>
</head>
<body>

<div class="box">
<h1>Boxes</h1>

<input id="boxName" placeholder="Box name">
<input id="boxNotes" placeholder="Notes optional">

<button onclick="addBox()">Add Box</button>

<p id="msg"></p>

<a href="index.html">Back to Home</a>
</div>

<form id="hiddenForm" method="POST" target="hiddenFrame" style="display:none;">
<input name="payload" id="payload">
</form>

<iframe name="hiddenFrame" style="display:none;"></iframe>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-U6GNlgib1X8IfhA2j3FKU3NpVrvfK_ZKmIrumcu8eBOIcapg7rrPz87XmWm4AhRD/exec";

function addBox(){
    const box = document.getElementById("boxName").value.trim();
    const notes = document.getElementById("boxNotes").value.trim();

    if(!box){
        alert("Enter a box name");
        return;
    }

    document.getElementById("hiddenForm").action = SCRIPT_URL;
    document.getElementById("payload").value = JSON.stringify({
        action:"CREATE_BOX",
        box:box,
        notes:notes
    });

    document.getElementById("hiddenForm").submit();

    document.getElementById("msg").innerText = "Box submitted. Check your sheet.";
    document.getElementById("boxName").value = "";
    document.getElementById("boxNotes").value = "";
}
</script>

</body>
</html>
